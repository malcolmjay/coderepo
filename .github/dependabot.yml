version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups:
      aws-sdk:
        patterns: ["boto3", "botocore", "s3transfer"]
      psycopg:
        patterns: ["psycopg", "psycopg-binary"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
